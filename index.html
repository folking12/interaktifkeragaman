<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keragaman Budaya Indonesiaku – PPT Interaktif Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EAF1FF;--surf:#FFFFFF;--surf2:#F2F6FF;--ink:#16204F;--mut:#4B5688;
  --pri:#2336A0;--pri-ink:#FFFFFF;--acc:#F5B82E;--acc-ink:#3A2A00;
  --red:#D8452E;--grn:#2E9A5E;--line:#C7D4F5;--motif:rgba(35,54,160,.07);
  --okbg:#DDF5E7;--nobg:#FDE3DE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1440;--surf:#19235E;--surf2:#141C52;--ink:#F2F5FF;--mut:#B5BFEA;
    --pri:#3B4FD0;--line:#34428F;--motif:rgba(255,255,255,.05);--okbg:#17493A;--nobg:#5A2530;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1440;--surf:#19235E;--surf2:#141C52;--ink:#F2F5FF;--mut:#B5BFEA;
  --pri:#3B4FD0;--line:#34428F;--motif:rgba(255,255,255,.05);--okbg:#17493A;--nobg:#5A2530;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:clamp(16px,1.5vw,21px);line-height:1.5;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(circle at 0 0,var(--motif) 0 15px,transparent 16px),radial-gradient(circle at 44px 44px,var(--motif) 0 15px,transparent 16px);
  background-size:44px 44px;
}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--pri);color:#fff}
.top .brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.1em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cnt{font-weight:800;opacity:.9;white-space:nowrap}
.ib{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;width:40px;height:40px;font-size:1.1em;display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.28)}
.ib[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.bar{height:5px;background:rgba(255,255,255,.25)}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
main{flex:1;overflow:auto;padding:20px 16px 28px;scroll-behavior:smooth}
.slide{display:none;max-width:1120px;margin:0 auto}
.slide.on{display:block}
.stitle{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-left:14px;border-left:8px solid var(--sc,var(--pri))}
.stitle .sic{font-size:2.1em;line-height:1}
.stitle h1{font-size:clamp(1.6em,3.4vw,2.6em);font-weight:800}
.stitle p{margin:2px 0 0;color:var(--mut)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surf);border-top:2px solid var(--line)}
.nav .nb{border:0;border-radius:999px;padding:10px 20px;font-weight:800;background:var(--pri);color:#fff;min-width:104px}
.nav .nb:disabled{opacity:.35;cursor:default}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri);background:transparent;padding:0}
.dots button.on{background:var(--pri)}
.dots button.g{border-radius:4px}
.card{background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:14px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.pts{margin:0;padding-left:1.2em}
.pts li{margin:.3em 0;font-size:1.08em}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:800;background:var(--pri);color:#fff}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri)}
:root[data-theme="dark"] .btn.ghost{color:#fff;border-color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:#fff;border-color:#fff}}
.btn.ok{background:var(--grn)}.btn.no{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-block;padding:4px 12px;border-radius:10px;background:var(--surf2);border:2px solid var(--line);font-weight:700;font-size:.92em}
.mut{color:var(--mut)}
.big{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(2.4em,7vw,5em);line-height:1}
.center{text-align:center}
.hide{display:none!important}
.sub{font-size:1.2em;margin:0 0 8px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{border:2px solid var(--line);background:var(--surf);border-radius:12px;padding:8px 14px;font-weight:800}
.tab.on{background:var(--tc,var(--pri));color:#fff;border-color:var(--tc,var(--pri))}
.fb{min-height:1.6em;font-weight:800;margin-top:8px}
.fb.ok{color:var(--grn)}.fb.no{color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:10px}
.opt{border:2px solid var(--line);background:var(--surf);border-radius:14px;padding:12px;font-weight:800;text-align:center}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--grn)}
.opt.no{background:var(--nobg);border-color:var(--red)}
.qtext{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.45em;line-height:1.25}
.hint{color:var(--mut);margin-top:4px}
/* slide 1 */
.hero{display:grid;gap:18px;grid-template-columns:1.1fr .9fr;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(2.2em,5.4vw,4.2em);font-weight:800;color:var(--pri)}
:root[data-theme="dark"] .hero h2{color:#FFD76A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero h2{color:#FFD76A}}
.kids{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:2.6em;padding:14px;border-radius:24px;background:linear-gradient(#CBE6FF,#E4F6D9);}
.kids span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.kids span:nth-child(2n){animation-delay:.4s}.kids span:nth-child(3n){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-8px)}}
.sing{background:var(--acc);color:var(--acc-ink);border-radius:18px;padding:16px;font-weight:800;text-align:center}
.sing .note{font-size:2em;display:inline-block;animation:bob 1s infinite}
textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;background:var(--surf);color:var(--ink);resize:vertical}
/* slide 2 */
.numcard{position:relative;text-align:center;padding:20px 12px;border-radius:22px;color:#fff;overflow:hidden;min-height:190px}
.numcard .ico{font-size:2em}
.numcard .lbl{font-weight:800;font-size:1.1em}
.numcard .cover{position:absolute;inset:0;border:0;border-radius:22px;background:var(--surf);color:var(--ink);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:3.6em;display:grid;place-items:center;border:3px dashed var(--line)}
.numcard .cover small{display:block;font-size:.25em;font-family:'Nunito',sans-serif;color:var(--mut)}
.quote{border-left:6px solid var(--acc);padding:6px 14px;font-size:1.08em;background:var(--surf2);border-radius:0 12px 12px 0}
.clap{font-size:2.4em;display:inline-block}
.clap.pop{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.5) rotate(-8deg)}}
/* slide 3 */
.garden{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:20px;background:linear-gradient(#DDF1FF,#CDEBC6)}
.fl{border:0;background:transparent;padding:0;width:84px}
.fl svg{width:100%;height:auto;transition:transform .2s}
.fl:active svg{transform:scale(1.15) rotate(10deg)}
.wordq span{opacity:.12;transition:opacity .3s}.wordq span.on{opacity:1}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tm-d{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.2em;min-width:3.4em}
.tm-d.end{color:var(--red)}
.poll b{font-size:1.6em}
/* slide 4 */
.prov{display:flex;flex-wrap:wrap;gap:8px}
.undi{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(1.8em,4vw,3em);text-align:center;padding:18px;border-radius:20px;background:var(--surf2);border:3px dashed var(--line);min-height:1.8em}
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcell{border:2px solid var(--line);background:var(--surf);border-radius:12px;padding:16px 6px;font-weight:800;text-align:center;min-height:68px}
.bcell.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.sandi{display:flex;flex-wrap:wrap;gap:6px 22px}
.word{display:flex;gap:4px}
.sl{width:2.4em;height:2.8em;border:2px solid var(--line);border-radius:10px;background:var(--surf);display:grid;place-items:center;font-weight:800;position:relative}
.sl.open{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sl small{position:absolute;top:1px;left:4px;font-size:.6em;color:var(--mut)}
.sl.open small{color:var(--acc-ink)}
/* slide 5 */
.trow{display:grid;grid-template-columns:1.1fr 1.6fr 1.3fr;gap:8px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line)}
.rev{border:2px dashed var(--line);background:var(--surf2);border-radius:10px;padding:6px 10px;text-align:left;color:var(--mut);font-weight:700;min-height:2.2em}
.rev.open{border-style:solid;background:var(--okbg);color:var(--ink)}
.blank{display:inline-block;min-width:4em;border:0;border-bottom:3px solid var(--acc);background:var(--surf2);font-weight:800;padding:0 8px;color:var(--ink);border-radius:6px 6px 0 0}
.sapa{text-align:center}
.sapa .w{font-family:'Baloo 2',sans-serif;font-size:2em;font-weight:800}
/* slide 6/7/8 */
.qbox{min-height:260px}
.qtop{font-weight:800;color:var(--mut);margin-bottom:4px}
.move{font-size:1.3em;font-weight:800;text-align:center;padding:16px;border-radius:16px;background:var(--surf2);border:2px dashed var(--line);min-height:3.4em}
.bud{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.bud dt{font-weight:800}.bud dd{margin:0}
.pcard{border:0;border-radius:18px;padding:18px 10px;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.2em;min-height:96px}
.pcard small{display:block;font-family:'Nunito',sans-serif;font-weight:700;opacity:.9}
.ctab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.item{background:var(--surf2);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.item b{display:block}
.aud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.aud input{display:none}
.aud label{cursor:pointer}
/* slide 9-11 */
.chk{display:flex;align-items:center;gap:10px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surf);font-weight:700}
.chk input{width:22px;height:22px;accent-color:var(--grn)}
.role{text-align:center;padding:12px 8px}
.role .e{font-size:2em}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.panel{border:3px solid var(--ink);border-radius:8px;background:var(--surf);padding:10px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.panel .sc{font-size:3em}
.panel.hid{opacity:.15;filter:grayscale(1)}
.qa{border:2px solid var(--line);background:var(--surf);border-radius:14px;padding:10px 14px;text-align:left;width:100%;font-weight:800}
.qa .ans{display:none;font-weight:700;color:var(--mut);margin-top:6px}
.qa.open .ans{display:block}
.steps{display:grid;gap:10px}
.step{border:0;text-align:left;border-radius:16px;padding:12px 16px;color:#fff;font-weight:800;font-size:1.1em;background:var(--sb)}
.step span{display:none;font-weight:700;font-size:.9em;margin-top:4px}
.step.open span{display:block}
.karya{border:3px solid var(--line);background:var(--surf);border-radius:18px;padding:14px;text-align:center;font-weight:800}
.karya.on{border-color:var(--pri);background:var(--surf2)}
.karya .e{font-size:2.4em;display:block}
.emo{border:3px solid var(--line);background:var(--surf);border-radius:18px;font-size:2.4em;padding:8px 14px}
.emo.on{border-color:var(--acc);background:var(--acc)}
/* games */
.gamewrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.gamewrap{grid-template-columns:1fr}}
.board{position:relative;width:100%;max-width:640px;aspect-ratio:1;margin:0 auto;border-radius:12px;overflow:hidden;border:3px solid var(--ink)}
.board .cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.cell{font-size:clamp(8px,1.1vw,13px);font-weight:800;padding:2px 3px;color:#2a2a2a}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pion{position:absolute;width:5.5%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transform:translate(-50%,-50%);transition:left .5s,top .5s;z-index:3;display:grid;place-items:center;font-size:.7em;font-weight:800;color:#fff}
.dice{width:78px;height:78px;border-radius:16px;background:#fff;color:#222;border:3px solid var(--ink);display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.6em}
.dice.roll{animation:shake .4s}
@keyframes shake{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.tchip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;border:3px solid transparent;background:var(--surf2);font-weight:800}
.tchip.cur{border-color:var(--acc)}
.tchip i{width:16px;height:16px;border-radius:50%;display:inline-block}
.kcard{border-radius:18px;padding:16px;border:3px solid var(--line);background:var(--surf)}
.lvl{display:inline-block;border-radius:999px;padding:2px 12px;color:#fff;font-weight:800;font-size:.85em}
.map{width:100%;max-width:560px;margin:0 auto;display:block}
.ans{margin-top:8px;padding:10px 14px;border-radius:12px;background:var(--okbg);font-weight:700}
.sheet{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-height:42vh;overflow:auto;background:var(--acc);color:var(--acc-ink);padding:14px 18px;border-radius:20px 20px 0 0;z-index:20;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.sheet h3{margin-bottom:4px}
.menu{position:fixed;inset:0;z-index:30;background:rgba(10,14,50,.72);display:grid;place-items:center;padding:16px}
.menu .box{background:var(--surf);border-radius:22px;padding:18px;max-width:560px;width:100%;max-height:86vh;overflow:auto}
.menu button.m{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:var(--surf2);border-radius:12px;padding:10px 12px;margin:5px 0;font-weight:800}
.menu button.m.on{outline:3px solid var(--acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}main{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">🇮🇩 Keragaman Budaya Indonesiaku</div>
    <div class="cnt" id="cnt">1 / 14</div>
    <button class="ib" id="bMenu" title="Daftar slide" aria-label="Daftar slide">☰</button>
    <button class="ib" id="bNote" title="Naskah guru (N)" aria-label="Naskah guru" aria-pressed="false">🗒️</button>
    <button class="ib" id="bSnd" title="Suara" aria-label="Suara" aria-pressed="true">🔊</button>
    <button class="ib" id="bTheme" title="Terang/gelap" aria-label="Ganti tema">🌓</button>
    <button class="ib" id="bFs" title="Layar penuh (F)" aria-label="Layar penuh">⛶</button>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <main id="main"></main>
  <div class="sheet hide" id="sheet" role="note"><h3>Naskah guru</h3><div id="sheetTxt"></div></div>
  <nav class="nav">
    <button class="nb" id="bPrev">◀ Kembali</button>
    <div class="dots" id="dots"></div>
    <button class="nb" id="bNext">Lanjut ▶</button>
  </nav>
</div>
<div class="menu hide" id="menu"><div class="box"><h2 style="margin-bottom:8px">Daftar slide</h2><div id="menuList"></div><button class="btn" id="menuX" style="margin-top:10px">Tutup</button></div></div>

<script>
/* ===== utilitas ===== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rnd = n => Math.floor(Math.random()*n);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let soundOn = true, AC;
function tone(f,d=.15,t='sine',v=.14,when=0){ if(!soundOn) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.type=t; o.frequency.value=f; o.connect(g); g.connect(AC.destination); const s=AC.currentTime+when; g.gain.setValueAtTime(v,s); g.gain.exponentialRampToValueAtTime(.001,s+d); o.start(s); o.stop(s+d+.02);}catch(e){} }
const sfx = { ok(){tone(660,.12);tone(880,.2,'sine',.14,.12)}, no(){tone(200,.28,'sawtooth',.07)}, pop(){tone(520,.08,'triangle')}, fan(){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.11,i*.1))}, dice(){for(let i=0;i<5;i++)tone(300+rnd(300),.05,'square',.05,i*.06)} };
function countUp(node,to,ms=1300){ if(reduce){node.textContent=to.toLocaleString('id-ID');return;} const t0=performance.now(); (function f(t){ const p=Math.min(1,(t-t0)/ms); node.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('id-ID'); if(p<1) requestAnimationFrame(f); })(t0); }
function timerHTML(){ return `<div class="timer"><span class="tm-d" role="timer">00:00</span><button class="btn tm-s">Mulai / jeda</button><button class="btn ghost tm-r">Ulang</button></div>`; }
function timer(root,sec){ let left=sec, iv=null; const d=$('.tm-d',root); const draw=()=>d.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'); draw();
  $('.tm-s',root).onclick=()=>{ if(iv){clearInterval(iv);iv=null;return;} iv=setInterval(()=>{ left--; draw(); if(left<=0){clearInterval(iv);iv=null;sfx.fan();d.classList.add('end');} },1000); };
  $('.tm-r',root).onclick=()=>{ clearInterval(iv); iv=null; left=sec; draw(); d.classList.remove('end'); }; }
function quiz(box,items,opt={}){
  let i=0, score=0, list=[...items];
  function show(){
    if(i>=list.length){ box.innerHTML=`<div class="center"><div class="big">🎉</div><p class="sub">Skor kelas: <b>${score}</b> dari ${list.length} (dijawab benar pada percobaan pertama)</p><button class="btn" data-r>Main lagi</button></div>`; sfx.fan(); $('[data-r]',box).onclick=()=>{i=0;score=0;list=shuffle(items);show();}; return; }
    const it=list[i]; let tried=false;
    box.innerHTML=`<div class="qtop">Soal ${i+1} dari ${list.length}</div><div class="qtext">${it.q}</div>${it.hint?`<div class="hint">${it.hint}</div>`:''}<div class="extra"></div><div class="opts">${shuffle(it.opts).map(o=>`<button class="opt">${o}</button>`).join('')}</div><div class="fb" aria-live="polite"></div><div class="row" style="margin-top:8px"></div>`;
    if(opt.extra) opt.extra($('.extra',box),it);
    $$('.opt',box).forEach(b=>b.onclick=()=>{

<div class="card hide" id="bP" style="margin-top:14px"><h3>Urutan tampil</h3><div class="row" style="margin:8px 0"><label for="ng">Jumlah kelompok</label><input id="ng" type="number" min="2" max="10" value="6" style="width:4.5em;font:inherit;padding:6px;border-radius:10px;border:2px solid var(--line);background:var(--surf);color:var(--ink)"><button class="btn acc" id="ac">🎲 Acak urutan</button></div><div class="row" id="ur"></div><p class="mut" style="margin:10px 0 0">Siswa yang belum siap tampil bisa berperan sebagai pembawa acara, penata kostum, atau penulis naskah.</p></div>
<div class="card hide" id="bR" style="margin-top:14px"><h3>Refleksi akhir</h3><label for="r3"><b>Hal yang saya pelajari</b></label><textarea id="r3" placeholder="Tulis di sini..."></textarea>
<p style="margin:10px 0 6px"><b>Seberapa paham kamu hari ini?</b></p><div class="row" id="em"></div><div class="fb" id="emf"></div></div>`,
init(r){
  const sw=id=>{ ['bP','bR'].forEach(x=>$('#'+x,r).classList.toggle('hide',x!==id)); sfx.pop(); };
  $('#hP',r).onclick=()=>sw('bP'); $('#hR',r).onclick=()=>sw('bR'); $('#hU',r).onclick=()=>go(12); $('#hJ',r).onclick=()=>go(13);
  $('#ac',r).onclick=()=>{ const n=Math.max(2,Math.min(10,+$('#ng',r).value||6)); $('#ur',r).innerHTML=shuffle([...Array(n)].map((_,i)=>i+1)).map((x,i)=>`<span class="chip">${i+1}. Kelompok ${x}</span>`).join(''); sfx.fan(); };
  const em=[['😟','Masih bingung'],['🙂','Paham sebagian'],['😀','Paham sebagian besar'],['🤩','Paham semua, bisa mengajari teman']];
  $('#em',r).innerHTML=em.map((e,i)=>`<button class="emo" data-i="${i}" aria-label="${e[1]}">${e[0]}</button>`).join('');
  $$('.emo',r).forEach(b=>b.onclick=()=>{ $$('.emo',r).forEach(x=>x.classList.toggle('on',x===b)); $('#emf',r).textContent=em[+b.dataset.i][1]; sfx.pop(); }); }});

/* 13 Ular Tangga */
S.push({t:'Game: Ular Tangga Budaya',ic:'🎲',col:'#2F80ED',game:true,
note:'Lempar dadu, pion maju sesuai mata dadu. Jika berhenti di kaki tangga naik, jika di kepala ular turun. Setelah itu kelompok menjawab kartu pertanyaan. Benar maju 1 langkah, salah mundur 1 langkah. Kelompok pertama yang mencapai kotak 100 menang.',
html:`<div id="utSetup" class="card"><h3>Berapa kelompok yang bermain?</h3><div class="row" style="margin-top:8px" id="utN"></div><p class="mut" style="margin:10px 0 0">Aturan: lempar dadu dan maju sesuai mata dadu. Tangga = naik, ular = turun. Lalu jawab kartu: <b>benar +1 langkah, salah −1 langkah</b>. Pertama sampai 100 menang.</p></div>
<div class="gamewrap hide" id="utGame"><div><div class="board" id="board"></div></div>
<div><div class="row" id="utT" style="margin-bottom:10px"></div><div class="card"><div class="row"><div class="dice" id="dice">🎲</div><div><b id="utWho"></b><div class="mut" id="utMsg">Tekan tombol untuk melempar dadu.</div></div></div><div class="row" style="margin-top:10px"><button class="btn acc" id="utRoll">🎲 Lempar dadu</button><button class="btn ghost" id="utReset">Mulai ulang</button></div></div>
<div class="kcard hide" id="utCard" style="margin-top:12px"></div></div></div>`,
init(r){
  const L={4:14,9:31,21:42,28:84,51:67,71:91}, SN={16:6,47:26,62:19,64:60,87:24,93:73,98:78};
  const pos=n=>{ const rr=Math.floor((n-1)/10), ix=(n-1)%10, c=rr%2===0?ix:9-ix; return {x:c*10+5,y:(9-rr)*10+5}; };
  const cellColor=n=>{ const rr=Math.floor((n-1)/10), ix=(n-1)%10, c=rr%2===0?ix:9-ix; return (rr+c)%2?'#FFE9A8':'#FFFFFF'; };
  let N=4, P=[], turn=0, deck=[], busy=false, over=false;
  $('#utN',r).innerHTML=[2,3,4,5,6].map(n=>`<button class="btn" data-n="${n}">${n} kelompok</button>`).join('');
  $$('#utN .btn',r).forEach(b=>b.onclick=()=>start(+b.dataset.n));
  function board(){
    let cells=''; for(let rr=9;rr>=0;rr--) for(let c=0;c<10;c++){ const n=rr%2===0?rr*10+c+1:rr*10+(9-c)+1; cells+=`<div class="cell" style="background:${cellColor(n)}">${n}</div>`; }
    const lines=Object.entries(L).map(([a,b])=>{ const A=pos(+a),B=pos(b); return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#2E9A5E" stroke-width="2.4" stroke-linecap="round" opacity=".85"/><line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#fff" stroke-width=".6" stroke-dasharray="1.5 2.2" opacity=".9"/>`; }).join('')
      + Object.entries(SN).map(([a,b])=>{ const A=pos(+a),B=pos(b); const mx=(A.x+B.x)/2+7, my=(A.y+B.y)/2; return `<path d="M${A.x} ${A.y} Q${mx} ${my} ${B.x} ${B.y}" fill="none" stroke="#D8452E" stroke-width="2.4" stroke-linecap="round" opacity=".85"/><circle cx="${A.x}" cy="${A.y}" r="1.6" fill="#D8452E"/>`; }).join('');
    $('#board',r).innerHTML=`<div class="cells">${cells}</div><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>`+P.map((_,i)=>`<div class="pion" id="pi${i}" style="background:${TEAMC[i]}">${i+1}</div>`).join('');
    place();
  }
  function place(){ const groups={}; P.forEach((p,i)=>(groups[p]=groups[p]||[]).push(i)); P.forEach((p,i)=>{ const o=pos(p), g=groups[p], k=g.indexOf(i), off=(k-(g.length-1)/2)*3.2; const el=$('#pi'+i,r); el.style.left=(o.x+off)+'%'; el.style.top=(o.y+(k%2?1.4:-1.4))+'%'; }); }
  function teams(){ $('#utT',r).innerHTML=P.map((p,i)=>`<div class="tchip ${i===turn&&!over?'cur':''}"><i style="background:${TEAMC[i]}"></i>${i+1}. ${TEAMN[i]}: <b>${p}</b></div>`).join(''); $('#utWho',r).textContent=`Giliran kelompok ${turn+1} (${TEAMN[turn]})`; }
  function start(n){ N=n; P=Array(N).fill(1); turn=0; over=false; busy=false; deck=shuffle(CARDS); $('#utSetup',r).classList.add('hide'); $('#utGame',r).classList.remove('hide'); $('#utCard',r).classList.add('hide'); $('#utRoll',r).disabled=false; $('#utMsg',r).textContent='Tekan tombol untuk melempar dadu.'; board(); teams(); }
  const wait=ms=>new Promise(res=>setTimeout(res,reduce?0:ms));
  async function land(i){ if(P[i]>=100){ P[i]=100; place(); return true; } if(L[P[i]]){ await wait(450); P[i]=L[P[i]]; place(); $('#utMsg',r).textContent='Naik tangga! 🪜'; sfx.ok(); await wait(550); } else if(SN[P[i]]){ await wait(450); P[i]=SN[P[i]]; place(); $('#utMsg',r).textContent='Turun lewat ular! 🐍'; sfx.no(); await wait(550); } return false; }
  function win(i){ over=true; teams(); $('#utRoll',r).disabled=true; $('#utWho',r).textContent=`🏆 Kelompok ${i+1} (${TEAMN[i]}) menang!`; $('#utMsg',r).textContent='Selamat! Tepuk tangan untuk semua kelompok.'; $('#utCard',r).classList.add('hide'); sfx.fan(); }
  $('#utRoll',r).onclick=async()=>{ if(busy||over) return; busy=true; $('#utRoll',r).disabled=true; const d=$('#dice',r); d.classList.add('roll'); sfx.dice(); await wait(450); d.classList.remove('roll'); const v=1+rnd(6); d.textContent=v; const i=turn; P[i]=Math.min(100,P[i]+v); place(); teams(); $('#utMsg',r).textContent=`Dadu: ${v}. Kelompok ${i+1} maju ke kotak ${P[i]}.`; await wait(600);
    if(await land(i)||P[i]>=100){ win(i); busy=false; return; } teams();
    if(!deck.length) deck=shuffle(CARDS); const c=deck.pop(); const card=$('#utCard',r); card.classList.remove('hide'); card.style.borderColor=LVC[c[0]];
    card.innerHTML=`<span class="lvl" style="background:${LVC[c[0]]}">${c[0]}</span><p class="qtext" style="margin:8px 0">${c[1]}</p><button class="btn ghost" id="ka">Lihat jawaban</button><div class="ans hide" id="kan">${c[2]}</div><div class="row hide" id="kj" style="margin-top:10px"><button class="btn ok" id="kb">✓ Benar (+1)</button><button class="btn no" id="ks">✗ Salah (−1)</button></div>`;
    $('#ka',r).onclick=()=>{ $('#kan',r).classList.remove('hide'); $('#kj',r).classList.remove('hide'); $('#ka',r).classList.add('hide'); sfx.pop(); };
    const done=async delta=>{ $('#kj',r).classList.add('hide'); P[i]=Math.max(1,Math.min(100,P[i]+delta)); place(); teams(); delta>0?sfx.ok():sfx.no(); await wait(500); if(await land(i)||P[i]>=100){ win(i); busy=false; return; } turn=(turn+1)%N; card.classList.add('hide'); teams(); $('#utMsg',r).textContent='Tekan tombol untuk melempar dadu.'; $('#utRoll',r).disabled=false; busy=false; };
    $('#kb',r).onclick=()=>done(1); $('#ks',r).onclick=()=>done(-1); };
  $('#utReset',r).onclick=()=>{ $('#utSetup',r).classList.remove('hide'); $('#utGame',r).classList.add('hide'); };
}});

/* 14 Jelajah Nusantara */
S.push({t:'Game: Jelajah Nusantara (Kalimantan)',ic:'⛵',col:'#E8751A',game:true,
note:'Kita berlayar menyusuri lima kota di Pulau Kalimantan: Pontianak, Palangka Raya, Banjarmasin, Samarinda, dan Tanjung Selor. Pertanyaan makin sulit di tiap kota. Jawaban benar membuat kapalmu berlayar dan mendapat poin. Jika salah, kelompok lain boleh merebut poin. Petunjuk ekstra mengurangi 5 poin.',
html:`<div id="jSetup" class="card"><h3>Berapa kelompok yang berlayar?</h3><div class="row" style="margin-top:8px" id="jN"></div><p class="mut" style="margin:10px 0 0">Aturan: jawab pertanyaan di kota tujuan. Benar = kapal maju + poin (10, 20, 30, 40, 50). Salah = kelompok lain boleh merebut poin, kapalmu tetap di kota itu. Petunjuk ekstra mengurangi 5 poin.</p></div>
<div class="gamewrap hide" id="jGame"><div><svg class="map" id="jmap" viewBox="0 0 400 300" role="img" aria-label="Peta rute Pulau Kalimantan"></svg></div>
<div><div class="row" id="jT" style="margin-bottom:10px"></div><div class="kcard" id="jCard"></div></div></div>`,
init(r){
  let N=4, st=[], pts=[], turn=0, hint=false, over=false;
  $('#jN',r).innerHTML=[2,3,4,5,6].map(n=>`<button class="btn" data-n="${n}">${n} kelompok</button>`).join('');
  $$('#jN .btn',r).forEach(b=>b.onclick=()=>start(+b.dataset.n));
  function map(){ const route=KAL.map((k,i)=>`${i?'L':'M'}${k.x} ${k.y}`).join(' ');
    const ships=st.map((s,i)=>{ const k=KAL[Math.min(s,4)]; const ox=(i%3-1)*14, oy=(Math.floor(i/3)*16)-22; return `<g transform="translate(${k.x+ox} ${k.y+oy})"><circle r="9" fill="${TEAMC[i]}" stroke="#fff" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${s>=5?'🏁':i+1}</text></g>`; }).join('');
    $('#jmap',r).innerHTML=`<path d="M60 130 C70 70 140 40 200 35 C250 20 320 60 340 110 C350 160 320 200 290 240 C260 280 190 285 140 255 C90 235 50 190 60 130 Z" fill="#7DC38A" stroke="#2E7A47" stroke-width="3"/><path d="${route}" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="3 8" stroke-linecap="round"/>`+KAL.map((k,i)=>`<g><circle cx="${k.x}" cy="${k.y}" r="12" fill="#fff" stroke="#E8751A" stroke-width="3"/><text x="${k.x}" y="${k.y+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#B04A00">${i+1}</text><text x="${k.x}" y="${k.y+(i===4?-18:26)}" text-anchor="middle" font-size="12" font-weight="800" fill="#16204F" stroke="#fff" stroke-width="3" paint-order="stroke">${k.kota}</text></g>`).join('')+ships; }
  function teams(){ $('#jT',r).innerHTML=st.map((s,i)=>`<div class="tchip ${i===turn&&!over?'cur':''}"><i style="background:${TEAMC[i]}"></i>${i+1}. ${TEAMN[i]}: <b>${pts[i]}</b> poin ${s>=5?'🏁':''}</div>`).join(''); }
  function next(){ for(let k=1;k<=N;k++){ const t=(turn+k)%N; if(st[t]<5){ turn=t; return true; } } return false; }
  function finish(){ over=true; const rank=pts.map((p,i)=>[p,i]).sort((a,b)=>b[0]-a[0]); $('#jCard',r).style.borderColor='var(--grn)'; $('#jCard',r).innerHTML=`<div class="center"><div class="big">🏆</div><h3>Semua kapal sudah tiba!</h3><p class="sub">Juara: Kelompok ${rank[0][1]+1} (${TEAMN[rank[0][1]]}) dengan ${rank[0][0]} poin</p><button class="btn" id="jAgain">Main lagi</button></div>`; sfx.fan(); $('#jAgain',r).onclick=()=>{ $('#jSetup',r).classList.remove('hide'); $('#jGame',r).classList.add('hide'); }; teams(); }
  function ask(){ if(over) return; teams(); map(); const s=st[turn], k=KAL[s]; hint=false; const card=$('#jCard',r); card.style.borderColor=LVC[k.lv];
    card.innerHTML=`<div class="row"><span class="lvl" style="background:${LVC[k.lv]}">Stasiun ${s+1}: ${k.lv}</span><b>Kelompok ${turn+1} (${TEAMN[turn]})</b></div><p class="mut" style="margin:6px 0 0">📍 ${k.kota}, ${k.prov}</p><p class="qtext" style="margin:8px 0">${k.q}</p><div class="row"><button class="btn ghost" id="jh">💡 Petunjuk (−5 poin)</button><button class="btn ghost" id="ja">Lihat jawaban</button></div><div class="hint hide" id="jhT">${k.h}</div><div class="ans hide" id="jaT">${k.a}</div><div class="row hide" id="jj" style="margin-top:10px"><button class="btn ok" id="jb">✓ Benar</button><button class="btn no" id="js">✗ Salah</button></div><div id="jr"></div>`;
    $('#jh',r).onclick=()=>{ hint=true; $('#jhT',r).classList.remove('hide'); sfx.pop(); };
    $('#ja',r).onclick=()=>{ $('#jaT',r).classList.remove('hide'); $('#jj',r).classList.remove('hide'); $('#ja',r).classList.add('hide'); sfx.pop(); };
    $('#jb',r).onclick=()=>{ pts[turn]+=Math.max(0,(s+1)*10-(hint?5:0)); st[turn]++; sfx.ok(); teams(); map(); if(st.every(x=>x>=5)){ finish(); return; } setTimeout(()=>{ next(); ask(); },reduce?0:700); };
    $('#js',r).onclick=()=>{ sfx.no(); $('#jj',r).classList.add('hide'); const others=st.map((_,i)=>i).filter(i=>i!==turn);
      $('#jr',r).innerHTML=`<p style="margin:10px 0 6px"><b>Rebutan:</b> kelompok mana yang menjawab benar?</p><div class="row">${others.map(i=>`<button class="btn" style="background:${TEAMC[i]}" data-t="${i}">Kelompok ${i+1}</button>`).join('')}<button class="btn ghost" data-t="-1">Tidak ada</button></div>`;
      $$('#jr [data-t]',r).forEach(b=>b.onclick=()=>{ const t=+b.dataset.t; if(t>=0){ pts[t]+=Math.max(0,(s+1)*10-(hint?5:0)); sfx.ok(); } if(!next()){ finish(); return; } ask(); }); }; }
  function start(n){ N=n; st=Array(N).fill(0); pts=Array(N).fill(0); turn=0; over=false; $('#jSetup',r).classList.add('hide'); $('#jGame',r).classList.remove('hide'); ask(); }
}});

/* ===== mesin deck ===== */
let cur=0;
const main=$('#main');
S.forEach((s,i)=>{ const sec=document.createElement('section'); sec.className='slide'; sec.id='s'+i; sec.style.setProperty('--sc',s.col);
  sec.innerHTML=`<div class="stitle"><span class="sic" aria-hidden="true">${s.ic}</span><div><h1>${s.game?'':`Slide ${i+1}: `}${s.t}</h1></div></div>${s.html}`; main.append(sec); s.init&&s.init(sec); });
const dots=$('#dots'); dots.innerHTML=S.map((s,i)=>`<button class="${s.game?'g':''}" aria-label="Slide ${i+1}: ${s.t}" data-i="${i}"></button>`).join('');
$$('#dots button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
function go(i){ cur=Math.max(0,Math.min(S.length-1,i)); $$('.slide').forEach((el,j)=>el.classList.toggle('on',j===cur)); $$('#dots button').forEach((b,j)=>b.classList.toggle('on',j===cur));
  $('#cnt').textContent=`${cur+1} / ${S.length}`; $('#prog').style.width=((cur+1)/S.length*100)+'%'; $('#bPrev').disabled=cur===0; $('#bNext').disabled=cur===S.length-1; $('#sheetTxt').textContent=S[cur].note; main.scrollTop=0; $$('#menuList .m').forEach((b,j)=>b.classList.toggle('on',j===cur)); }
$('#bPrev').onclick=()=>go(cur-1); $('#bNext').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(e.target.tagName)) return; if(e.key==='ArrowRight'||e.key==='PageDown') go(cur+1); else if(e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1); else if(e.key==='n'||e.key==='N') $('#bNote').click(); else if(e.key==='f'||e.key==='F') $('#bFs').click(); });
$('#bNote').onclick=()=>{ const sh=$('#sheet'); sh.classList.toggle('hide'); $('#bNote').setAttribute('aria-pressed',String(!sh.classList.contains('hide'))); };
$('#bSnd').onclick=()=>{ soundOn=!soundOn; $('#bSnd').setAttribute('aria-pressed',String(soundOn)); $('#bSnd').textContent=soundOn?'🔊':'🔇'; };
$('#bTheme').onclick=()=>{ const root=document.documentElement; const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme=dark?'light':'dark'; };
$('#bFs').onclick=()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} };
$('#menuList').innerHTML=S.map((s,i)=>`<button class="m" data-i="${i}"><span style="font-size:1.4em">${s.ic}</span>${s.game?'Game':'Slide '+(i+1)}: ${s.t}</button>`).join('');
$$('#menuList .m').forEach(b=>b.onclick=()=>{ go(+b.dataset.i); $('#menu').classList.add('hide'); });
$('#bMenu').onclick=()=>$('#menu').classList.remove('hide'); $('#menuX').onclick=()=>$('#menu').classList.add('hide'); $('#menu').onclick=e=>{ if(e.target.id==='menu') $('#menu').classList.add('hide'); };
go(0);
</script>
</body>
</html>
